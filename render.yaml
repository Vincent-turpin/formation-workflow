# Déploiement en un clic sur Render (Blueprint)
services:
  - type: web
    name: qlick-boost
    runtime: node
    rootDir: qlick-boost
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: qlick-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: QLICK_DB
        value: /data/db.json
      - key: QLICK_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: QLICK_ADMIN_EMAIL
        sync: false
      - key: QLICK_ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: noreply@qlick.fr
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: QLICK_DEMO
        value: "1"
      - key: QLICK_DEMO_PASSWORD
        sync: false
