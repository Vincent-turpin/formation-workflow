<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace commerçant — Qlick Boost</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
    .box { width: min(440px, 92vw); }
    .box h1 { font-size: 1.5rem; margin: 26px 0 4px; }
    .tabs { display: flex; gap: 4px; background: rgba(10,5,22,.6); border: 1px solid var(--line); padding: 4px; border-radius: 999px; margin: 18px 0 6px; }
    .tabs button { flex: 1; border: 0; padding: 10px; border-radius: 999px; background: transparent; font: inherit; font-weight: 600; cursor: pointer; color: var(--muted); }
    .tabs button.on { background: linear-gradient(120deg, var(--violet), var(--plasma)); color: #fff; }
    .back { display: inline-block; margin-top: 18px; font-size: 14px; color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
<div class="box">
  <a class="logo" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/></linearGradient></defs><circle cx="15" cy="15" r="10.5" fill="none" stroke="url(#qg)" stroke-width="3.2"/><circle cx="24.5" cy="24.5" r="3.6" fill="#F3EEFF"/></svg>Qlick <small>Boost</small></a>
  <h1>Espace commerçant</h1><p class="muted" style="margin:0">Pilotez votre roue, vos avis et vos clients.</p>
  <div class="card" style="margin-top:18px">
    <div class="tabs"><button id="t-login" class="on">Connexion</button><button id="t-signup">Créer un compte</button></div>
    <form id="form">
      <div id="biz" hidden><label for="businessName">Nom de votre établissement</label><input id="businessName" name="businessName" placeholder="Ex. Le Petit Bistrot">
        <div id="invite" hidden><label for="inviteCode">Code d'invitation</label><input id="inviteCode" name="inviteCode" placeholder="Fourni par Qlick"></div></div>
      <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Mot de passe</label><input id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
      <p class="error" id="err"></p>
      <button class="btn" style="width:100%" id="submit">Se connecter</button>
    </form>
    <p class="muted" id="demoHint" style="font-size:13px;margin-bottom:0" hidden>Compte de démo : <b>demo@qlick.fr</b> / <b>demo1234</b></p>
  </div>
  <a class="back" href="/">← Retour à Qlick Boost</a> · <a class="back" href="https://qlick.fr/contact">Besoin d'aide ?</a>
</div>
<script>
let inviteRequired = false;
let mode = new URLSearchParams(location.search).get('signup') ? 'signup' : 'login';
const set = (m) => {
  mode = m;
  document.getElementById('t-login').classList.toggle('on', m === 'login');
  document.getElementById('t-signup').classList.toggle('on', m === 'signup');
  document.getElementById('biz').hidden = m !== 'signup';
  document.getElementById('businessName').required = m === 'signup';
  document.getElementById('inviteCode').required = inviteRequired && m === 'signup';
  document.getElementById('submit').textContent = m === 'signup' ? 'Créer mon compte — 14 jours offerts' : 'Se connecter';
};
document.getElementById('t-login').onclick = () => set('login');
document.getElementById('t-signup').onclick = () => set('signup');
set(mode);
fetch('/api/config').then((r) => r.json()).then((c) => {
  document.getElementById('demoHint').hidden = !c.demo;
  inviteRequired = c.inviteRequired;
  document.getElementById('invite').hidden = !inviteRequired;
  set(mode);
});
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const res = await fetch(`/api/auth/${mode}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await res.json();
  if (!res.ok) return (document.getElementById('err').textContent = d.error);
  location.href = d.redirect || '/dashboard';
};
</script>
</body>
</html>
