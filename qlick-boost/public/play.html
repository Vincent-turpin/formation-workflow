<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tentez votre chance !</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; background: radial-gradient(600px 400px at 50% -10%, color-mix(in srgb, var(--brand) 25%, transparent), transparent), var(--bg); }
    main { max-width: 460px; margin: 0 auto; padding: 28px 18px 40px; text-align: center; }
    h1 { font-size: 24px; }
    .step { display: none; }
    .step.active { display: block; animation: fade .35s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .action { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; margin: 10px 0; border-radius: 14px; border: 2px solid var(--line); background: #fff; cursor: pointer; font: inherit; color: inherit; }
    .action:hover { border-color: var(--brand); }
    .action .ic { font-size: 30px; }
    .action b { display: block; }
    canvas { width: min(88vw, 380px); height: min(88vw, 380px); }
    .result { padding: 28px 20px; border-radius: 20px; background: #fff; border: 1px solid var(--line); }
    .result .prize { font: 700 26px/1.2 var(--display); color: var(--brand); margin: 6px 0 14px; }
    .code { font-family: ui-monospace, monospace; font-size: 26px; font-weight: 800; letter-spacing: .1em; padding: 12px; border: 2px dashed var(--brand); border-radius: 12px; margin: 12px 0; }
    form { text-align: left; }
    .brandbar { font-size: 12px; color: var(--muted); margin-top: 30px; }
    .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 50; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  </style>
</head>
<body class="light">
<main>
  <div id="loading" class="muted">Chargement…</div>

  <!-- Étape 1 : choix de l'action -->
  <section class="step" id="s-action">
    <h1 id="title">Tentez votre chance !</h1>
    <p class="muted" id="welcome"></p>
    <p style="font-weight:700;margin-top:24px">Pour jouer, choisissez une action :</p>
    <button class="action" data-action="google" hidden><span class="ic">⭐</span><span><b>Laisser un avis Google</b><small class="muted">Votre avis sincère, quelle que soit la note</small></span></button>
    <button class="action" data-action="instagram" hidden><span class="ic">📸</span><span><b>Suivre notre Instagram</b><small class="muted">Restez informé de nos nouveautés</small></span></button>
    <button class="action" data-action="none" hidden><span class="ic">🎁</span><span><b>Jouer directement</b><small class="muted">Sans action requise</small></span></button>
  </section>

  <!-- Étape 2 : confirmation après redirection -->
  <section class="step" id="s-back">
    <h1>Merci ! 🙌</h1>
    <p class="muted" id="back-text">Une fois votre action effectuée, revenez ici pour tourner la roue.</p>
    <button class="btn" id="btn-done" style="margin-top:12px">C'est fait, je veux jouer !</button>
    <p><a href="#" id="btn-reopen" class="muted" style="font-size:14px">Rouvrir la page</a></p>
  </section>

  <!-- Étape 3 : formulaire -->
  <section class="step" id="s-form">
    <h1>Dernière étape</h1>
    <p class="muted">Pour recevoir votre éventuel cadeau :</p>
    <form id="form" class="card">
      <label for="firstName">Prénom</label>
      <input id="firstName" name="firstName" required autocomplete="given-name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <div id="phoneWrap" hidden><label for="phone">Téléphone (optionnel)</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
      <label class="check"><input type="checkbox" name="consent" required> J'accepte le règlement du jeu. Une seule participation par personne sur la période définie par l'établissement.</label>
      <label class="check"><input type="checkbox" name="marketingOptIn"> J'accepte de recevoir les offres de l'établissement (désinscription possible à tout moment).</label>
      <p class="error" id="form-err"></p>
      <button class="btn" style="width:100%">Accéder à la roue 🎡</button>
    </form>
  </section>

  <!-- Étape 4 : roue -->
  <section class="step" id="s-wheel">
    <h1>À vous de jouer !</h1>
    <canvas id="wheel" width="760" height="760"></canvas>
    <div><button class="btn" id="btn-spin" style="margin-top:14px;font-size:18px;padding:16px 34px">Tourner la roue</button></div>
    <p class="error" id="spin-err"></p>
  </section>

  <!-- Étape 5 : résultat -->
  <section class="step" id="s-result">
    <div class="result" id="result"></div>
  </section>

  <div class="brandbar">Propulsé par <a href="https://qlick.fr" target="_blank" rel="noopener"><b>Qlick Boost</b></a></div>
</main>

<script src="/wheel.js"></script>
<script>
const slug = location.pathname.split('/').pop();
const src = new URLSearchParams(location.search).get('src') || 'direct';
let cfg, wheel, chosenAction, player;

const show = (id) => { document.querySelectorAll('.step').forEach((s) => s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); };

async function init() {
  const res = await fetch(`/api/public/${slug}`);
  document.getElementById('loading').remove();
  if (!res.ok) { document.querySelector('main').insertAdjacentHTML('afterbegin', '<h1>Oups</h1><p class="muted">Ce jeu n\'existe pas ou n\'est plus actif.</p>'); return; }
  cfg = await res.json();
  document.documentElement.style.setProperty('--brand', cfg.primaryColor);
  document.title = `${cfg.name} — Tentez votre chance !`;
  document.getElementById('title').textContent = cfg.name;
  document.getElementById('welcome').textContent = cfg.welcomeText;
  document.getElementById('phoneWrap').hidden = !cfg.collectPhone;
  document.querySelectorAll('.action').forEach((b) => {
    const a = b.dataset.action;
    const ok = cfg.actions[a] && (a === 'none' || (a === 'google' ? cfg.googleReviewUrl : cfg.instagramUrl));
    b.hidden = !ok;
    b.onclick = () => choose(a);
  });
  wheel = new Wheel(document.getElementById('wheel'), cfg.segments);
  show('s-action');
}

function choose(action) {
  chosenAction = action;
  if (action === 'none') return show('s-form');
  const url = action === 'google' ? cfg.googleReviewUrl : cfg.instagramUrl;
  document.getElementById('back-text').textContent = action === 'google'
    ? 'Une fois votre avis publié sur Google, revenez ici pour tourner la roue.'
    : 'Une fois abonné(e) à notre compte Instagram, revenez ici pour tourner la roue.';
  document.getElementById('btn-reopen').onclick = (e) => { e.preventDefault(); window.open(url, '_blank'); };
  window.open(url, '_blank');
  // on laisse un petit délai pour éviter le clic immédiat
  const btn = document.getElementById('btn-done');
  btn.disabled = true; setTimeout(() => (btn.disabled = false), 4000);
  show('s-back');
}
document.getElementById('btn-done').onclick = () => show('s-form');

document.getElementById('form').onsubmit = (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  player = { firstName: f.get('firstName'), email: f.get('email'), phone: f.get('phone'), consent: !!f.get('consent'), marketingOptIn: !!f.get('marketingOptIn') };
  show('s-wheel');
  wheel.idle();
};

document.getElementById('btn-spin').onclick = async (e) => {
  const btn = e.currentTarget; btn.disabled = true;
  const err = document.getElementById('spin-err'); err.textContent = '';
  const res = await fetch(`/api/public/${slug}/spin?src=${encodeURIComponent(src)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...player, action: chosenAction }),
  });
  const data = await res.json();
  if (!res.ok) {
    err.textContent = data.error;
    if (data.code) err.innerHTML += `<br><a href="/coupon/${data.code}">Voir mon bon</a>`;
    if (res.status === 400) { btn.disabled = false; show('s-form'); document.getElementById('form-err').textContent = data.error; }
    return;
  }
  const idx = cfg.segments.findIndex((s) => s.id === data.segmentId);
  await wheel.spinTo(Math.max(0, idx));
  renderResult(data);
};

function renderResult(d) {
  const el = document.getElementById('result');
  const fmt = (s) => new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  if (d.kind === 'win') {
    confetti();
    const delayed = new Date(d.validFrom) > new Date();
    el.innerHTML = `<div style="font-size:52px">🎉</div><h1>Félicitations ${escapeHtml(player.firstName)} !</h1>
      <p class="muted">Vous avez gagné :</p><div class="prize">${escapeHtml(d.label)}</div>
      <p>Présentez ce code en boutique :</p><div class="code">${d.code}</div>
      <p class="muted" style="font-size:14px">${delayed ? `Utilisable à partir du ${fmt(d.validFrom)} · ` : ''}Valable jusqu'au ${fmt(d.expiresAt)}</p>
      <a class="btn" href="${d.couponUrl}">Ouvrir mon bon cadeau</a>
      <p class="muted" style="font-size:13px;margin-top:14px">Faites une capture d'écran pour le garder précieusement 📸</p>`;
  } else {
    el.innerHTML = `<div style="font-size:52px">🍀</div><h1>Pas de chance cette fois…</h1>
      <p class="muted">Merci pour votre participation ${escapeHtml(player.firstName)} ! Vous pourrez retenter votre chance lors de votre prochaine visite.</p>`;
  }
  show('s-result');
}

function confetti() {
  const colors = ['#8B5CF6', '#D946EF', '#C9B8FF', '#6D28D9', '#F3EEFF'];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
init();
</script>
</body>
</html>
